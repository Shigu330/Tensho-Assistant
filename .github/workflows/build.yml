# Activated in 0.447 (draft of 0.323).
# Builds the plugin, runs the tests and the language checks and packages it on every push and pull request, like .\scripts\Verify.ps1
# on a contributor's PC. Dalamud's assemblies come from goatcorp's public distribution (the same files XIVLauncher installs).
name: "Build and test"

on:
  push:
    branches: [ "main", "Devloppement" ]
  pull_request:
    branches: [ "main", "Devloppement" ]

permissions:
  contents: read

jobs:
  build:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Download Dalamud
        shell: pwsh
        run: |
          $hooks = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $hooks | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $hooks -Force
          "DALAMUD_HOME=$hooks" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify (build, tests, languages, package)
        shell: pwsh
        run: ./scripts/Verify.ps1 -Force -DotNet dotnet

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TenshoAssistant-latest
          path: src/TenshoAssistant/bin/x64/Release/TenshoAssistant/latest.zip
          retention-days: 7

  d17:
    # 0.512: same image and command as the Dalamud repository (docs/evidence/0.512-d17-build.md). It keeps the network, for Dalamud and the packages.
    name: Build like the Dalamud repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/dotnet/sdk:10.0.101
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Dalamud
        run: |
          New-Item -ItemType Directory -Force -Path /work/dalamud | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile /tmp/dalamud.zip
          Expand-Archive -Path /tmp/dalamud.zip -DestinationPath /work/dalamud -Force

      - name: Restore from the lock file
        working-directory: src/TenshoAssistant
        run: dotnet restore --locked-mode -p:DalamudLibPath=/work/dalamud/

      - name: Build
        working-directory: src/TenshoAssistant
        run: dotnet build -c Release -o /tmp/output -p:DalamudLibPath=/work/dalamud/ -p:IsPlogonBuild=True

      - name: Check the output
        run: |
          foreach ($file in 'TenshoAssistant/latest.zip', 'TenshoAssistant/TenshoAssistant.json') {
            if (-not (Test-Path "/tmp/output/$file")) { throw "missing: $file" }
          }
          $internal = 'Dalamud.dll', 'Dalamud.Bindings.ImGui.dll', 'Dalamud.Bindings.ImGuizmo.dll', 'Dalamud.Bindings.ImPlot.dll', 'ImGuiScene.dll'
          $found = Get-ChildItem /tmp/output -Recurse -Filter *.dll | Where-Object { $internal -contains $_.Name }
          if ($found) { throw "Dalamud's own DLL in the output: $($found.Name -join ', ')" }
          $manifest = Get-Content -Raw /tmp/output/TenshoAssistant/TenshoAssistant.json | ConvertFrom-Json
          if ($manifest.InternalName -ne 'TenshoAssistant') { throw "internal name: $($manifest.InternalName)" }
          "Built $($manifest.AssemblyVersion), API level $($manifest.DalamudApiLevel)"
