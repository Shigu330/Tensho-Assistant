name: "CodeQL"

on:
  push:
    branches: [ "main", "Devloppement" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 5 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Dalamud.NET.Sdk stops the build when Dalamud is not installed (~/.xlcore/dalamud/Hooks/dev on Linux): the official
      # distribution is unpacked there for its reference assemblies only; nothing from it is run.
      # X-148: checked against goatcorp's published version and the API level of global.json (scripts/Get-Dalamud.ps1).
      - name: Download Dalamud
        shell: pwsh
        run: ./scripts/Get-Dalamud.ps1 -Destination "$HOME/.xlcore/dalamud/Hooks/dev"

      - name: Restore
        run: dotnet restore TenshoAssistant.sln

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build
        run: dotnet build src/TenshoAssistant/TenshoAssistant.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"

  analyze-desktop:
    # X-148 (0.1791): the desktop application (src/TenshoAssistant.Desktop, net10.0-windows) and the pinned copy of PluginUiTest.Host it
    # builds, which the Linux job above cannot build: a Windows job. Dalamud's reference assemblies where these projects look for them
    # (DALAMUD_HOME), checked as in build.yml (scripts/Get-Dalamud.ps1); nothing from them is run. Its own category, beside the plugin's.
    name: Analyze C# (desktop application)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Download Dalamud
        shell: pwsh
        run: |
          $hooks = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          ./scripts/Get-Dalamud.ps1 -Destination $hooks
          "DALAMUD_HOME=$hooks" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore src/TenshoAssistant.Desktop/TenshoAssistant.Desktop.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        run: dotnet build src/TenshoAssistant.Desktop/TenshoAssistant.Desktop.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:csharp/desktop"